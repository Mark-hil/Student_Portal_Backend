name: Backend CD Pipeline (Publish to Docker Registry)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:

concurrency:
  group: cd-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Stage 1: Build Docker Container Image
  # ─────────────────────────────────────────────────────────────
  build-image:
    name: Stage 1 — Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: student-portal-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker Image Archive
        run: |
          docker save student-portal-backend:test -o /tmp/backend-image.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-image
          path: /tmp/backend-image.tar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # Stage 2: Container Smoke & Runtime Verification
  # ─────────────────────────────────────────────────────────────
  test-image:
    name: Stage 2 — Smoke Test Built Image
    needs: [build-image]
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-docker-image
          path: /tmp

      - name: Load Docker Image
        run: |
          docker load --input /tmp/backend-image.tar
          docker images

      - name: Verify Python & Gunicorn Runtime Entrypoints
        run: |
          echo "Verifying Python runtime inside container..."
          docker run --rm --entrypoint python student-portal-backend:test -V
          echo "Verifying Gunicorn server inside container..."
          docker run --rm --entrypoint gunicorn student-portal-backend:test --version

      - name: Verify Django System Check Inside Container
        run: |
          echo "Verifying Django system check inside container..."
          docker run --rm \
            -e SECRET_KEY=ci-pre-push-test-secret-key \
            -e DJANGO_SETTINGS_MODULE=config.settings.development \
            student-portal-backend:test python manage.py check
          echo "✅ Container smoke tests passed! Image is verified healthy."

  # ─────────────────────────────────────────────────────────────
  # Stage 3: Publish Verified Image to Docker Registry
  # ─────────────────────────────────────────────────────────────
  publish-image:
    name: Stage 3 — Publish to Docker Hub
    needs: [test-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata & Semantic Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/student-portal-backend
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Download Verified Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-docker-image
          path: /tmp

      - name: Load and Push Image to Docker Hub
        run: |
          docker load --input /tmp/backend-image.tar
          for tag in ${{ steps.meta.outputs.tags }}; do
            echo "Tagging and pushing $tag..."
            docker tag student-portal-backend:test "$tag"
            docker push "$tag"
          done

      - name: Publish Deployment Summary to GitHub Actions
        run: |
          echo "## 🚀 Verified Backend Docker Image Successfully Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${{ secrets.DOCKERHUB_USERNAME }}/student-portal-backend\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛡️ Smoke Test Status: **PASSED (Python, Gunicorn, Django System Check verified)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏷️ Published Tags:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
