name: Backend CD Pipeline (Docker Hub & DigitalOcean)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:

concurrency:
  group: cd-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Continuous Deployment: Build, Push to Docker Hub, Deploy to DO
  # ─────────────────────────────────────────────────────────────
  build-and-deploy:
    name: Build, Publish & Deploy to DigitalOcean
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/student-portal-backend
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install doctl (DigitalOcean CLI)
        if: ${{ env.DO_TOKEN_AVAILABLE == 'true' }}
        env:
          DO_TOKEN_AVAILABLE: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN != '' && secrets.DO_APP_ID != '' }}
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Trigger DigitalOcean App Platform Deployment (doctl)
        if: ${{ env.DO_TOKEN_AVAILABLE == 'true' }}
        env:
          DO_TOKEN_AVAILABLE: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN != '' && secrets.DO_APP_ID != '' }}
        run: |
          echo "Initiating DigitalOcean App Platform deployment for App ID: ${{ secrets.DO_APP_ID }}"
          doctl apps create-deployment ${{ secrets.DO_APP_ID }} --wait=false
          echo "✅ Deployment trigger dispatched to DigitalOcean App Platform successfully!"

      - name: Trigger DigitalOcean Webhook Deployment (Alternative Fallback)
        if: ${{ secrets.DO_DEPLOY_WEBHOOK_URL != '' }}
        run: |
          echo "Triggering DigitalOcean deployment via webhook..."
          curl -X POST -f "${{ secrets.DO_DEPLOY_WEBHOOK_URL }}"
          echo "✅ DigitalOcean deploy webhook invoked successfully!"
