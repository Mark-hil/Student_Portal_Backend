name: Backend CD Pipeline (Publish to Docker Registry)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:

concurrency:
  group: cd-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Continuous Deployment: Build, Smoke Test & Publish
  # ─────────────────────────────────────────────────────────────
  build-and-publish:
    name: Build, Verify & Publish Backend to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata & Semantic Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/student-portal-backend
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Build Docker Image (Local Test Target)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: student-portal-backend:pre-push-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── PRE-PUSH CONTAINER SMOKE TESTS ──────────────────────────
      - name: Run Container Image Smoke Tests
        run: |
          echo "Verifying Python runtime and entrypoints inside container..."
          docker run --rm --entrypoint python student-portal-backend:pre-push-test -V
          docker run --rm --entrypoint gunicorn student-portal-backend:pre-push-test --version
          
          echo "Verifying Django system check inside container..."
          docker run --rm \
            -e SECRET_KEY=ci-pre-push-test-secret-key \
            -e DJANGO_SETTINGS_MODULE=config.settings.development \
            student-portal-backend:pre-push-test python manage.py check
            
          echo "✅ Container smoke tests passed! Image is verified healthy."

      # ── PUSH VERIFIED IMAGE TO DOCKER HUB ────────────────────────
      - name: Push Verified Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Publish Deployment Summary to GitHub Actions
        run: |
          echo "## 🚀 Verified Backend Docker Image Successfully Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${{ secrets.DOCKERHUB_USERNAME }}/student-portal-backend\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛡️ Smoke Test Status: **PASSED (Python, Gunicorn, Django System Check verified)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏷️ Published Tags:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
