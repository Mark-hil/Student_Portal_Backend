services:
  # ── Redis (Celery queue & Channels layer) ───────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-devredispassword}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devredispassword}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [portal_net]
    restart: unless-stopped

  # ── Django API ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --worker-class gthread --threads 4 --timeout 60 --access-logfile - --error-logfile -
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      # Neon Database Connection
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
      DB_HOST: ${DB_HOST:-}
      DB_NAME: ${DB_NAME:-portal_db}
      DB_USER: ${DB_USER:-portal_user}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PORT: ${DB_PORT:-5432}
      # Cloudinary Media Storage
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_PROFILE_FOLDER: ${CLOUDINARY_PROFILE_FOLDER:-uniportal-profile picture}
      # Redis, Network & Security
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-devredispassword}@redis:6379/0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Email SMTP
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.sendgrid.net}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@asdam.edu.gh}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      # SMS Gateway
      ARKESEL_API_KEY: ${ARKESEL_API_KEY:-}
      ARKESEL_SENDER_ID: ${ARKESEL_SENDER_ID:-ASDAM}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - media_files:/app/media
    networks: [portal_net]
    restart: unless-stopped
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # ── Celery Worker (notifications, grades, file processing) ──────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config worker -l info -Q default,notifications,grades,files --concurrency 4
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      # Neon Database Connection
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
      DB_HOST: ${DB_HOST:-}
      DB_NAME: ${DB_NAME:-portal_db}
      DB_USER: ${DB_USER:-portal_user}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PORT: ${DB_PORT:-5432}
      # Cloudinary Media Storage
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_PROFILE_FOLDER: ${CLOUDINARY_PROFILE_FOLDER:-uniportal-profile picture}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-devredispassword}@redis:6379/0}
      # Email SMTP
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.sendgrid.net}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@asdam.edu.gh}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      # SMS Gateway
      ARKESEL_API_KEY: ${ARKESEL_API_KEY:-}
      ARKESEL_SENDER_ID: ${ARKESEL_SENDER_ID:-ASDAM}
    depends_on:
      - api
    networks: [portal_net]
    restart: unless-stopped

  # ── Celery Beat (scheduler) ─────────────────────────────────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      # Neon Database Connection
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
      DB_HOST: ${DB_HOST:-}
      DB_NAME: ${DB_NAME:-portal_db}
      DB_USER: ${DB_USER:-portal_user}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PORT: ${DB_PORT:-5432}
      # Cloudinary Media Storage
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_PROFILE_FOLDER: ${CLOUDINARY_PROFILE_FOLDER:-uniportal-profile picture}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-devredispassword}@redis:6379/0}
      # Email SMTP
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.sendgrid.net}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@asdam.edu.gh}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      # SMS Gateway
      ARKESEL_API_KEY: ${ARKESEL_API_KEY:-}
      ARKESEL_SENDER_ID: ${ARKESEL_SENDER_ID:-ASDAM}
    depends_on:
      - api
    networks: [portal_net]
    restart: unless-stopped

  # ── Local PostgreSQL (Optional fallback for offline local development) ──
  db:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: portal_db
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-portal_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_user -d portal_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [portal_net]

volumes:
  postgres_data:
  redis_data:
  media_files:

networks:
  portal_net:
    driver: bridge
